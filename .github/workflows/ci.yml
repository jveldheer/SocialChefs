name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || echo "Lint not fully configured"

      - name: Run unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter web playwright install --with-deps chromium

      - name: Seed demo database
        run: pnpm demo-seed
        env:
          DATABASE_URL: file:./data/social-chef.db
          DEMO_MODE: true

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: file:./data/social-chef.db
          DEMO_MODE: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
